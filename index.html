function hash(str){let n=2166136261;for(let i=0;i<str.length;i++){n^=str.charCodeAt(i);n=Math.imul(n,16777619)}return n>>>0}

async function loadTable(t){let out=[];for(let from=0;from<5000;from+=500){const {data,error}=await db.from(t).select('*').range(from,from+499);if(error)throw error;out.push(...data);if(data.length<500)break;}return out}
// History tables retain every attempt in PostgreSQL. The UI must show only the
// latest attempt per question, otherwise retries inflate progress and scores.
function latestPerQuestion(rows,fields){
 const sorted=[...rows].sort((a,b)=>{
  const t=String(b.created_at||'').localeCompare(String(a.created_at||''));
  return t||String(b.id||'').localeCompare(String(a.id||''));
 });
 const seen=new Set();
 return sorted.filter(row=>{const key=fields.map(k=>String(row[k])).join('|');
  if(seen.has(key))return false;seen.add(key);return true;
 });
}

}

async function send(table,row,conflict=null){if(busy)return false;busy=true;try{

  const query=conflict?db.from(table).upsert(row,{onConflict:conflict}):db.from(table).insert(row);
  const {error}=await query;if(error)throw error;
  await loadCloud();
 }else if(role==='demo'){
  const type={five_answers:'five',english_answers:'english',english_completions:'done',live_reviews:'reviews'}[table];
  const keys={five_answers:['study_day','subject','question_no'],english_answers:['lesson_no','question_no'],english_completions:['lesson_no'],live_reviews:['lesson_no']}[table];
  const i=state[type].findIndex(x=>keys.every(k=>x[k]===row[k]));
  if(i>=0)state[type][i]={...state[type][i],...row};else state[type].push({...row});saveDemo();

 }catch(e){flash='保存できませんでした: '+String(e.message||e);return false}finally{busy=false;render()}

function renderFive(){const day=nowDay(),plan=fivePlan(day),q=fiveCursor;if(q>=plan.length)return renderFiveSummary();const entry=plan[q],data=BANK[entry.subject][entry.question_id],r=state.five.find(x=>x.study_day===day&&x.subject===entry.subject&&x.question_no===entry.question_no);
 const random=rng(hash('v3:'+day+':'+entry.subject+':'+entry.question_id+':options'));const opts=shuffle([0,1,2,3],random);
 return `<section class="card"><div class="meta"><span class="count">${esc(entry.subject)} · ${entry.question_no+1}/3</span><span>${q+1}/15問</span></div><div class="progress"><div class="bar" style="width:${Math.round(q/15*100)}%"></div></div><h1 class="question">${esc(data[0])}</h1><div class="options">${opts.map((i,k)=>`<button class="option ${r&&i===data[2]?'correct':''} ${r&&i===r.choice_index&&!r.correct?'incorrect':''}" data-fivechoice="${i}" ${r?'disabled':''}><span class="abc">${String.fromCharCode(k+65)}</span><span>${esc(data[1][i])}</span></button>`).join('')}</div>${r?`<div class="feedback ${r.correct?'':'wrong'}"><strong>${r.correct?'正解！':'次はできるよ！'}</strong>${esc(data[3])}</div><button class="primary" id="fiveNext">${q===14?'結果を見る':'次の問題へ'}</button>`:''}</section><button class="ghost" id="home">← ホームに戻る</button>`;
}
function renderFiveSummary(){const day=nowDay(),rows=state.five.filter(x=>x.study_day===day),score=rows.filter(a=>a.correct).length;return `<section class="hero"><h1>今日もおつかれさま！ 🌷</h1><p>正解は${score}/${rows.length}問。続けたことも大事な成果だよ。</p></section><section class="card"><h2 class="section-title">今日の教科別結果</h2>${SUBJECTS.map(s=>{const a=rows.filter(x=>x.subject===s);return `<div class="review-item"><strong>${esc(s)}　${a.filter(x=>x.correct).length} / ${a.length} 正解</strong></div>`}).join('')}<button class="primary" id="home">ホームへ戻る</button></section>`}
function renderHistory(){const done=[...state.done].sort((a,b)=>b.lesson_no-a.lesson_no);return `<section class="card"><h2 class="section-title">英語の学習履歴</h2>${done.length?done.map(x=>{const p=lessonByNo(x.lesson_no),review=getReview(x.lesson_no),ans=getEngAnswers(x.lesson_no);return `<div class="review-item"><strong>${esc(formatDay(x.study_day))} · ${esc(p.name)} DAY ${p.day+1}</strong><p>クイズ ${ans.filter(a=>a.correct).length}/${ans.length}・Live ${x.did_live?'練習した':'お休み'}・自己評価 ${esc(({good:'使えた',middle:'もう少し',hard:'むずかしかった'})[x.self_rating]||'—')}</p><p>${review?'英会話評価あり':'英会話評価は未登録'}</p><button class="secondary" data-reviewlesson="${x.lesson_no}">${review?'評価を見る・編集':'評価を登録'}</button></div>`}).join(''):'<div class="empty">まだ学習履歴はありません</div>'}</section><section class="card"><h2 class="section-title">5教科の履歴（最近）</h2>${[...new Set(state.five.map(x=>x.study_day))].sort().reverse().slice(0,10).map(day=>{const rows=state.five.filter(x=>x.study_day===day);return `<div class="review-item"><strong>${esc(formatDay(day))}</strong><p>${rows.filter(x=>x.correct).length}/${rows.length} 正解</p></div>`}).join('')||'<div class="empty">まだ記録はありません</div>'}</section>`}
function renderGuardian(){const done=[...state.done].sort((a,b)=>b.lesson_no-a.lesson_no),totalFive=state.five.length,correct=state.five.filter(x=>x.correct).length;
 const recentDays=[...new Set(state.five.map(x=>x.study_day))].sort().reverse().slice(0,14);
 return `<section class="hero"><p class="eyebrow">保護者専用ページ</p><h1>${esc(learnerName)}の学習レポート</h1><p>会話内容の全文ではなく、本人が登録した評価とクイズの結果を表示します。</p></section><section class="card"><h2 class="section-title">学習の状況</h2><div class="stats"><div class="stat"><b>${done.length}</b><span>英語の完了日数</span></div><div class="stat"><b>${totalFive?Math.round(correct/totalFive*100)+'%':'—'}</b><span>5教科正答率</span></div><div class="stat"><b>${state.reviews.length}</b><span>Live評価の登録数</span></div></div><h3 class="title-sm">最近の5教科</h3>${recentDays.length?`<table class="logs"><thead><tr><th>日付</th><th>回答</th><th>正答率</th></tr></thead><tbody>${recentDays.map(day=>{const rows=state.five.filter(x=>x.study_day===day);return `<tr><td>${esc(formatDay(day))}</td><td>${rows.length}/15</td><td>${Math.round(rows.filter(x=>x.correct).length/rows.length*100)}%</td></tr>`}).join('')}</tbody></table>`:'<p class="muted">まだ記録がありません。</p>'}</section><section class="card"><h2 class="section-title">英語・Liveの履歴</h2>${done.length?done.map(x=>{const lesson=lessonByNo(x.lesson_no),a=getEngAnswers(x.lesson_no),r=getReview(x.lesson_no);const scores=r?[r.phrase_score,r.grammar_score,r.response_score].map(v=>v==null?'—':v+'/5').join(' / '):'—';return `<div class="review-item"><strong>${esc(formatDay(x.study_day))} · ${esc(lesson.name)} DAY ${lesson.day+1}</strong><p>クイズ ${a.filter(y=>y.correct).length}/${a.length} · Live ${x.did_live?'実施':'お休み'} · 評価 ${r?'登録済み':'未登録'}</p>${r?`<p>フレーズ / 文法 / 応答：${esc(scores)}</p><div class="review-text">${esc(r.review_text)}</div>`:''}</div>`}).join(''):'<div class="empty">英語の完了記録はありません。</div>'}</section><button class="secondary" id="refresh" style="width:100%">最新の結果に更新</button>`;
}
function parseScore(text,heading){const re=new RegExp(heading+'\\s*[:：]\\s*([1-5])(?:\\s*\\/\\s*5)?');const m=text.match(re);return m?Number(m[1]):null}
async function copyFrom(id){const t=E(id);if(!t)return;const s=t.value||t.textContent;try{await navigator.clipboard.writeText(s);flash='コピーしました。ChatGPTに貼り付けてください。'}catch{t.focus();t.select?.();flash='文章を選択しました。コピー操作をしてください。'}render()}
async function copyText(text){try{await navigator.clipboard.writeText(text);flash='コピーしました。ChatGPTに貼り付けてください。'}catch{flash='コピーできませんでした。ブラウザのコピー機能をお試しください。'}render()}
function bind(page){const on=(id,fn)=>{if(E(id))E(id).onclick=fn};
 on('home',()=>{view='home';flash='';render()});on('retry',()=>location.reload());
 on('demoStart',enterDemo);on('backToLogin',()=>{role='guest';view='home';flash='';render()});
 on('logout',async()=>{try{await db?.auth.signOut();role='guest';authUser=null;learnerId=null;state=blank();flash='ログアウトしました';view='home';render()}catch(e){logError(e)}});
 if(E('loginForm'))E('loginForm').onsubmit=async(ev)=>{ev.preventDefault();if(busy)return;busy=true;E('loginForm').querySelector('button').disabled=true;const {data,error}=await db.auth.signInWithPassword({email:E('loginEmail').value.trim(),password:E('loginPassword').value});busy=false;if(error){flash='ログインできませんでした。メールアドレスとパスワードを確認してください。';render();return}await enterCloud(data.user)};
 on('goEnglish',()=>{selectedLesson=engStatus().no;draftReview=null;engPage='phrases';view='phrases';render()});
 on('reviewLast',()=>{selectedLesson=state.done.toSorted((a,b)=>b.lesson_no-a.lesson_no)[0].lesson_no;draftReview=null;view='live';render()});
 on('goFive',()=>{const day=nowDay(),plan=fivePlan(day);fiveCursor=plan.findIndex(q=>!state.five.some(a=>a.study_day===day&&a.subject===q.subject&&a.question_no===q.question_no));view=fiveCursor<0?'fiveSummary':'five';render()});
 el.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>{const ph=lessonByNo(selectedLesson??engStatus().no).lesson.phrases[Number(b.dataset.speak)];if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(ph[0]);u.lang='en-US';u.rate=.78;speechSynthesis.speak(u)}});
 on('toEnglishQuiz',()=>{const no=selectedLesson??engStatus().no;engCursor=[0,1,2].findIndex(i=>!getEngAnswers(no).some(a=>a.question_no===i));if(engCursor===-1){view='live'}else view='english-quiz';render()});
 el.querySelectorAll('[data-engchoice]').forEach(b=>b.onclick=async()=>{const no=selectedLesson??engStatus().no,idx=engCursor,lesson=lessonByNo(no).lesson,choice=Number(b.dataset.engchoice);if(getEngAnswers(no).some(x=>x.question_no===idx))return;
 await send('english_answers',{learner_id:learnerId,lesson_no:no,question_no:idx,choice_index:choice,correct:choice===lesson.quiz[idx][2]})});
 on('engNext',()=>{engCursor++;if(engCursor>=3)view='live';render()});
 el.querySelectorAll('[data-fivechoice]').forEach(b=>b.onclick=async()=>{const day=nowDay(),q=fivePlan(day)[fiveCursor],choice=Number(b.dataset.fivechoice);if(state.five.some(x=>x.study_day===day&&x.subject===q.subject&&x.question_no===q.question_no))return;
 await send('five_answers',{learner_id:learnerId,study_day:day,subject:q.subject,question_no:q.question_no,question_id:q.question_id,choice_index:choice,correct:choice===BANK[q.subject][q.question_id][2]})});
 on('fiveNext',()=>{fiveCursor++;if(fiveCursor===15)view='fiveSummary';render()});
 on('copyLive',()=>copyText(englishPrompt(selectedLesson??engStatus().no)));on('copyEval',()=>copyText(evaluationPrompt(selectedLesson??engStatus().no)));
 // Keep the evaluation draft without triggering a full rerender while typing.
 if(E('evalText'))E('evalText').addEventListener('input',e=>{draftReview=e.target.value});
 on('pasteEval',async()=>{const field=E('evalText');if(!field)return;try{
  if(!navigator.clipboard?.readText)throw new Error('Clipboard API unavailable');
  const value=await navigator.clipboard.readText();if(!value){E('evalHelp').textContent='クリップボードが空です。ChatGPTの評価をコピーしてください。';return}
  field.value=value.slice(0,4000);draftReview=field.value;field.focus();E('evalHelp').textContent='貼り付けました。「評価を保存する」を押してください。';
 }catch(e){field.focus();E('evalHelp').textContent='ブラウザが自動貼り付けを許可しませんでした。ここを選択して ⌘V（Windowsは Ctrl+V）を押してください。';}
 });
 on('saveEval',async()=>{const review=E('evalText').value.trim();draftReview=review;if(!review){flash='評価の文章を貼り付けてください';render();return}const no=selectedLesson??engStatus().no;const saved=await send('live_reviews',{learner_id:learnerId,lesson_no:no,review_text:review,phrase_score:parseScore(review,'フレーズ活用'),grammar_score:parseScore(review,'文法'),response_score:parseScore(review,'応答'),updated_at:new Date().toISOString()},'learner_id,lesson_no');if(saved){draftReview=null;render()}});
 on('finishDay',async()=>{const no=selectedLesson??engStatus().no,live=E('didLive').value,rating=E('selfRating').value;if(!live||!rating){flash='Liveの実施と手応えを選んでね';render();return}
 if(getEngAnswers(no).length<3){flash='先に3問を終えてね';render();return}
 const success=await send('english_completions',{learner_id:learnerId,lesson_no:no,study_day:nowDay(),did_live:live==='yes',self_rating:rating});if(success){view='home';render()}});
 el.querySelectorAll('[data-reviewlesson]').forEach(b=>b.onclick=()=>{selectedLesson=Number(b.dataset.reviewlesson);draftReview=null;view='live';render()});
 on('refresh',async()=>{try{await loadCloud();flash='最新の記録を読み込みました';render()}catch(e){logError(e)}})
}
init();
</script><script>if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{})}</script></body></html>
